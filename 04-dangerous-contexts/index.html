<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Card — Dangerous Contexts Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    #card {
      border: 1px solid #ccc; border-radius: 8px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start;
    }
    #card img { width: 64px; height: 64px; border-radius: 50%; background: #eee; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    #result.pass { background: #e6f4ea; border: 1px solid #34a853; }
    #result.fail { background: #fce8e6; border: 1px solid #ea4335; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>User Profile Card</h1>
  <p>This card renders three untrusted fields into three different contexts:
     a <strong>website link</strong> (URL), an <strong>avatar image</strong> (attribute),
     and a <strong>contact button</strong> (event handler).</p>

  <div id="card"></div>

  <h2>Attack harness verdict</h2>
  <div id="result">Running attack harness…</div>

  <script src="app.js"></script>
  <script src="verify.js"></script>
</body>
</html>
