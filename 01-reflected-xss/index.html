<!DOCTYPE html>
<html lang="en">
<head>

  <title>Reflected XSS Lab — Search Banner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #results { margin: 1rem 0; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; font-weight: 600; white-space: pre-wrap; }

  </style>

<body>
  <h1>Search</h1>
  <p>This page echoes the <code>q</code> query parameter back into a results banner.</p>
  <p>Try it: <a href="?q=blue+widgets">?q=blue widgets</a> &middot;
     attack URL: <a href="?q=%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E">?q=&lt;img src=x onerror=alert(1)&gt;</a></p>

  <div id="results">Results for: </div>
