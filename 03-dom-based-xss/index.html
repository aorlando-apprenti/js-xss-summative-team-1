<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOM-Based XSS Lab — Hash-Routed Tabs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 0.75rem; }
    #panel { margin: 1rem 0; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; font-weight: 600; white-space: pre-wrap; }
    .pass { background: #e6f4ea; color: #1e7e34; border: 1px solid #1e7e34; }
    .fail { background: #fde8e8; color: #b02a37; border: 1px solid #b02a37; }
  </style>
</head>
<body>
  <h1>Tabbed View</h1>
  <p>The active tab is read from <code>location.hash</code> (the part after
     <code>#</code>) — entirely on the client. The fragment is never sent to the
     server, so server-side defenses cannot see this flow.</p>

  <nav>
    <a href="#home">home</a>
    <a href="#profile">profile</a>
    <a href="#settings">settings</a>
  </nav>

  <div id="panel"></div>

  <!-- Attack harness verdict -->
  <div id="result">Running attack harness…</div>

  <script src="app.js"></script>
  <script src="verify.js"></script>
</body>
</html>
