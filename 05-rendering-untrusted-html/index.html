<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rich Comments — Rendering Untrusted HTML Safely</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 44rem; }
    #comments { display: flex; flex-direction: column; gap: 0.75rem; }
    .comment { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    #result.pass { background: #e6f4ea; border: 1px solid #34a853; }
    #result.fail { background: #fce8e6; border: 1px solid #ea4335; }
  </style>
  <!-- DOMPurify, loaded from a CDN. The vetted library is the professional
       default for sanitizing untrusted HTML before it reaches the DOM. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <h1>Rich Comments</h1>
  <p>Comments may legitimately contain <strong>bold</strong>, <em>italic</em>,
     links, and lists, so they are rendered as <strong>HTML</strong> — which is
     why <code>textContent</code> cannot be used here. That makes safe rendering
     a sanitization problem.</p>

  <div id="comments"></div>

  <h2>Payload-battery verdict</h2>
  <div id="result">Running payload battery…</div>

  <script src="app.js"></script>
  <script src="verify.js"></script>
</body>
</html>
